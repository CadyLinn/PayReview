event: iOS AI Summer Camp 2026
name: PayReview
team_name: 忘性很差
category: Finance
intro: >
  PayReview is a personal finance app built around one idea: see the impact of a
  purchase before you make it, not after. Most budgeting apps only tell you
  where your money went once it's already spent — PayReview answers that
  question one step earlier, showing how a purchase affects today's budget, your
  flexible spending, and the savings goal you're working toward, before you tap
  "pay." After a short guided setup, users define their income cycle, essential
  expenses, flexible budget, and a savings goal (e.g. "Trip to Japan"). The
  "Today" view shows a live "safe to spend today" amount, along with an
  "Evaluate this purchase" tool: enter an amount and category, and PayReview
  projects how it would affect this week's budget and your goal timeline before
  you decide, not after. The "Plan" view summarizes the income cycle, essential
  expenses, flexible budget, safety buffer, and goals, and the "Records" view
  logs real expenses, income, and transfers — confirmed records update the
  budget, while an evaluation never does, keeping simulation and reality clearly
  separate. Accounts and data are backed by Firebase Authentication (email and
  Google sign-in) and Firestore sync.
