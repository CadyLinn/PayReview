  zh-TW:
    name: PayReview
    intro: >
      PayReview 是一款「消費前先看見影響」的個人財務規劃 App。多數記帳工具只能在花費之後告訴你錢去了哪裡， PayReview
      想解決的是更早一步的問題：在按下付款鍵之前，先讓你知道這筆錢會如何影響今天的預算、彈性支出，
      與你正在存的目標。使用者完成簡單的引導設定後，會建立收入週期、必要支出、彈性預算與存錢目標。
      「今天」頁面即時呈現「今天約可安心花的金額」，並提供「評估眼前的消費」功能：輸入金額與類別後， PayReview
      會試算這筆錢對本週預算與目標達成時間的影響，讓使用者在決定要不要花之前先看到後果。
      「計畫」頁面彙整收入週期、必要支出、彈性預算、安全緩衝與目標；「紀錄」頁面用於新增正式的支出、收入與轉帳，
      正式紀錄會更新預算，試算則不會，讓模擬與真實紀錄清楚分開。帳號與資料以 Firebase Authentication （Email 與
      Google 登入）與 Firestore 雲端同步。
